packages:
  - 'apps/*'
  - 'packages/*'

# Pin exact versions on `pnpm add` (pnpm 11+ reads this here, not from .npmrc)
saveExact: true

# Dependencies and whether they may run install scripts
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  sharp: false
  unrs-resolver: false
